[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eth-avm-relayer"
version = "0.1.0"
description = "M9: off-chain relayer/client for the ETH-AVM light client project (docs/design/009-relayer-client.md)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "m-reynaldo35" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
# Raised from ">=3.10" (011 §7.3/§16 gap 7/§18 item 4): >=3.10 was NEVER run
# by CI (both workflows were scaffold placeholders, see docs/design/
# 011-test-harness-ci.md §0) and this pass measures every real number in
# this repo on 3.13.3. >=3.12 is the honest floor: it is what `ci-offline`'s
# matrix (3.12, 3.13) actually runs, and `tests/harness/quarantine.py` needs
# stdlib `tomllib` (3.11+). MUST NOT ship a floor CI does not run (§18 item 4).
requires-python = ">=3.12"
# 012 §4.1: this used to also list fastapi/uvicorn/x402-avm -- measured to
# pull 59 packages total via `pip install --dry-run --report`, 40 of them
# (sentry-sdk, fastapi-cloud-cli, etc.) forbidden by relayer/'s own G8-M9
# import-purity test. Only these four are what `relayer/` actually imports;
# the service-only three now live in the `service` extra below (option A,
# §4.1). Measured with only these four: 19 packages.
dependencies = [
    "py-algorand-sdk",
    "rlp",
    "pycryptodome",
    "py_ecc",
]

[project.urls]
Repository = "https://github.com/m-reynaldo35/eth-avm-light-client"
Documentation = "https://github.com/m-reynaldo35/eth-avm-light-client/tree/main/docs"
Changelog = "https://github.com/m-reynaldo35/eth-avm-light-client/blob/main/CHANGELOG.md"

[project.scripts]
eth-avm-relayer = "relayer.cli:main"

# Only `relayer` is a distributable package today (docs/design/009-relayer-client.md
# §17) -- `contracts`, `tests`, `bench`, `deploy` are this repo's own
# development tree, not published artifacts. `service/x402_endpoint` is a real
# deployed artifact (Vercel, see [tool.vercel] below) but not a published
# package either. M12 ("Docs & packaging / release prep") owns the full
# release story; this file is the minimum needed for both `relayer`'s own
# editable-install consumers and Vercel's build to resolve everything they
# need from one file.
[tool.setuptools]
packages = ["relayer", "relayer.sources", "relayer.codec", "relayer.ssz", "relayer.proofs", "relayer.group", "relayer.drivers"]

# M11 (docs/design/011-test-harness-ci.md §7.2/§18 item 17): the test suite's
# dependencies, never declared anywhere before this pass -- `pip install -e .`
# alone did not get you a runnable suite. `algorand-python`/
# `algorand-python-testing` are pinned EXACTLY, not floated: `algopy_testing`
# is an emulator, and 174 of the 462 offline tests are assertions about
# emulated AVM semantics, so a minor-version drift changes what "passing"
# means. `puyapy` is its own extra (`contracts`), pinned exactly for the same
# reason and a stronger one -- it is the compiler whose output the
# compile-and-diff gate (§3.5) diffs byte-for-byte, and
# `deploy/schema/_compiled/*.compiled.json` records "puyapy_version": "5.9.0"
# in the artifact itself. Named `contracts`, not folded into `test`, because
# 007 §14.6 records a real trap: `pip install puya` fetches a DIFFERENT,
# incompatible package -- keeping the extra separate and precisely pinned is
# what stops that trap from being rediscovered.
[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "algorand-python==3.5.0",
    "algorand-python-testing==1.1.0",
    "remerkleable==0.1.28",
    "trie>=3.1",
    "PyYAML>=6",
    # tests/sync_committee/vectors.py needs cramjam.snappy.decompress_raw to
    # unpack the vendored .ssz_snappy consensus-spec-tests fixtures. Missing
    # from this list originally (already installed locally from an earlier,
    # undeclared pass) -- caught by the first real CI run this module ever
    # triggered (tests/sync_committee/test_signing_root.py ModuleNotFoundError
    # on a clean runner), exactly the class of bug ci-offline.yml exists to
    # catch.
    "cramjam>=2.11",
]
contracts = [
    "puyapy==5.9.0",
    # tests/ssz/test_budget.py shells out to `algokit compile py` to build a
    # real TEAL harness for live opcode-budget measurement (needs_algod, so
    # only ci-live.yml installs this extra). Missing from this list
    # originally -- worked locally only because it happened to already be
    # installed (via pipx) from an earlier, undeclared pass -- caught on
    # ci-live.yml's own first real execution (run 31228946039):
    # FileNotFoundError: [Errno 2] No such file or directory: 'algokit'.
    "algokit>=2.10,<3",
]

# 012 §4.1 option A: `service/x402_endpoint`'s own dependencies, moved out of
# `[project.dependencies]` so a plain `pip install eth-avm-relayer` no longer
# drags in fastapi/uvicorn/x402-avm's transitive closure (sentry-sdk,
# fastapi-cloud-cli, uvloop, typer, rich, ... -- 40 packages `relayer/`'s own
# G8-M9 import-purity test forbids it from ever importing). `relayer/` itself
# still imports none of these (unchanged). Vercel's Python/FastAPI builder
# resolves dependencies from THIS file exclusively once [tool.vercel] is
# present (confirmed live, 2026-08-07, pyproject.toml's prior comment) --
# whether it honours an EXTRA (`.[service]`) rather than only
# `[project.dependencies]` is unmeasured at design time (012 §4.1/§9 item 6)
# and must be settled by one real redeploy before this split can be
# considered closed for the live service, not just for the published wheel.
# Fallback if it does not: 012 §4.1 option B, a second, minimal
# `packaging/library/pyproject.toml` declaring only the four real deps, used
# to build the PUBLISHED wheel while this root file stays exactly as it is
# for Vercel. Not implemented unless the redeploy proves it necessary.
service = [
    "fastapi",
    "uvicorn[standard]",
    "x402-avm[fastapi,avm]",
]

# §7.2: `--strict-markers` so a typo'd marker is a collection error, not a
# silently never-selected test (T-7). `-p tests.harness.tiers -p
# tests.harness.variance` registers the tier/socket-guard/manifest plugin
# and the live_variance retry-policy plugin on every invocation, so no test
# command needs to remember `-p` flags by hand.
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures/spike-reference"]
addopts = "--strict-markers -p tests.harness.tiers -p tests.harness.variance"

# Real mainnet deployment (2026-08-07): service/x402_endpoint/main.py,
# resolved as service.x402_endpoint.main:app -- requires service/__init__.py
# and service/x402_endpoint/__init__.py to exist so the dotted path resolves.
# Vercel's Python/FastAPI framework detection needs this explicitly since the
# entrypoint isn't at one of its default-scanned locations (api/index.py,
# app/main.py, etc).
[tool.vercel]
entrypoint = "service.x402_endpoint.main:app"
